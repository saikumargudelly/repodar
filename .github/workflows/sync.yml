name: Scheduled Ingestion & Scoring Pipeline

on:
  schedule:
    # Run every 2 hours (00:00, 02:00, 04:00, ... UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Allow manual triggers from the GitHub Actions dashboard

jobs:
  run-pipeline:
    name: Trigger Ingestion and Scoring Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Repodar API Pipeline
        env:
          # The administrative endpoint URL.
          # Recommended repository secrets:
          #   - RENDER_BACKEND_URL: e.g. https://repodar-api.onrender.com
          #   - REPODAR_ADMIN_API_KEY: your X-API-Key value
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://repodar.up.railway.app' }}
          API_KEY: ${{ secrets.REPODAR_ADMIN_API_KEY }}
        run: |
          echo "Waking up Render backend and triggering pipeline asynchronously at: $BACKEND_URL"
          
          # Trigger the background pipeline run (returns immediately).
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "X-Admin-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            "$BACKEND_URL/admin/run-all")
          
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1 | cut -d':' -f2)
          
          echo "Trigger Response Body:"
          echo "$body"
          echo "HTTP Status Code: $status"
          
          if [ "$status" -ne 200 ] && [ "$status" -ne 201 ] && [ "$status" -ne 409 ]; then
            echo "Error: Failed to trigger pipeline (status code $status)"
            exit 1
          fi
          
          echo "Pipeline triggered successfully (or already running). Starting status polling..."
          
          # Poll the /admin/pipeline-status endpoint until execution is complete
          # Poll limit: 40 iterations * 15 seconds = 10 minutes max
          POLL_INTERVAL=15
          MAX_POLLS=40
          POLL_COUNT=0
          
          while [ $POLL_COUNT -lt $MAX_POLLS ]; do
            # Wait 15 seconds
            sleep $POLL_INTERVAL
            POLL_COUNT=$((POLL_COUNT + 1))
            
            status_response=$(curl -s -H "X-Admin-Key: $API_KEY" "$BACKEND_URL/admin/pipeline-status")
            
            # Use jq to extract running status and last result
            is_running=$(echo "$status_response" | jq -r '.running')
            last_status=$(echo "$status_response" | jq -r '.last_result.status')
            
            echo "Poll #$POLL_COUNT: running=$is_running, last_result_status=$last_status"
            
            if [ "$is_running" = "false" ]; then
              if [ "$last_status" = "complete" ]; then
                echo "Pipeline execution completed successfully!"
                echo "Result details:"
                echo "$status_response" | jq '.last_result'
                exit 0
              elif [ "$last_status" = "error" ]; then
                echo "Error: Pipeline failed. Details:"
                echo "$status_response" | jq '.last_result'
                exit 1
              else
                echo "Warning: Pipeline in unknown state. Continuing polling..."
              fi
            fi
          done
          
          echo "Error: Pipeline polling timed out after 10 minutes."
          exit 1
